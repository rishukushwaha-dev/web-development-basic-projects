<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="calci.css">
</head>
<body>
    <div class="calculator">
        <header class="calculator-header">
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="standard" aria-selected="true">Standard</button>
                <button class="mode-tab" data-mode="scientific" aria-selected="false">Scientific</button>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="5"/><g stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
                </button>
                <button class="icon-btn" id="historyToggle" aria-label="Toggle history" title="History (H)">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M13 3c-4.97 0-9 4.03-9 9h-1c0-5.52 4.48-10 10-10v3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12zm9 8h-3v3h-2v-3H8v-2h3V8h2v3h3v2z"/></svg>
                </button>
            </div>
        </header>
        
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>
        
        <div class="memory-indicator" id="memoryIndicator" hidden>M</div>
        
        <div class="buttons-standard" id="standardButtons">
            <button class="btn func" data-action="clear">C</button>
            <button class="btn func" data-action="backspace">⌫</button>
            <button class="btn func" data-action="percent">%</button>
            <button class="btn operator" data-action="divide">÷</button>

            <button class="btn num" data-value="7">7</button>
            <button class="btn num" data-value="8">8</button>
            <button class="btn num" data-value="9">9</button>
            <button class="btn operator" data-action="multiply">×</button>

            <button class="btn num" data-value="4">4</button>
            <button class="btn num" data-value="5">5</button>
            <button class="btn num" data-value="6">6</button>
            <button class="btn operator" data-action="subtract">−</button>

            <button class="btn num" data-value="1">1</button>
            <button class="btn num" data-value="2">2</button>
            <button class="btn num" data-value="3">3</button>
            <button class="btn operator" data-action="add">+</button>

            <button class="btn num" data-value="0" style="grid-column: span 2">0</button>
            <button class="btn num" data-value=".">.</button>
            <button class="btn equals" data-action="equals">=</button>
        </div>
        
        <div class="buttons-scientific" id="scientificButtons" hidden>
            <div class="sci-row">
                <button class="btn func sci-func" data-action="mc" title="Memory Clear">MC</button>
                <button class="btn func sci-func" data-action="mr" title="Memory Recall">MR</button>
                <button class="btn func sci-func" data-action="madd" title="Memory Add">M+</button>
                <button class="btn func sci-func" data-action="msub" title="Memory Subtract">M−</button>
                <button class="btn func" data-action="clear">C</button>
                <button class="btn func" data-action="backspace">⌫</button>
            </div>
            <div class="sci-row">
                <button class="btn func sci-func" data-action="sin" title="Sine">sin</button>
                <button class="btn func sci-func" data-action="cos" title="Cosine">cos</button>
                <button class="btn func sci-func" data-action="tan" title="Tangent">tan</button>
                <button class="btn func sci-func" data-action="asin" title="Arcsine">sin⁻¹</button>
                <button class="btn func sci-func" data-action="acos" title="Arccosine">cos⁻¹</button>
                <button class="btn func sci-func" data-action="atan" title="Arctangent">tan⁻¹</button>
            </div>
            <div class="sci-row">
                <button class="btn func sci-func" data-action="log" title="Logarithm base 10">log</button>
                <button class="btn func sci-func" data-action="ln" title="Natural logarithm">ln</button>
                <button class="btn func sci-func" data-action="sqrt" title="Square root">√</button>
                <button class="btn func sci-func" data-action="cbrt" title="Cube root">∛</button>
                <button class="btn func sci-func" data-action="pow" title="Power">xʸ</button>
                <button class="btn func sci-func" data-action="exp" title="eˣ">eˣ</button>
            </div>
            <div class="sci-row">
                <button class="btn func sci-func" data-action="factorial" title="Factorial">x!</button>
                <button class="btn func sci-func" data-action="pi" title="Pi (π)">π</button>
                <button class="btn func sci-func" data-action="euler" title="Euler's number (e)">e</button>
                <button class="btn func sci-func" data-action="leftParen" title="Left parenthesis">(</button>
                <button class="btn func sci-func" data-action="rightParen" title="Right parenthesis">)</button>
                <button class="btn func" data-action="percent">%</button>
            </div>
            <div class="sci-row">
                <button class="btn num" data-value="7">7</button>
                <button class="btn num" data-value="8">8</button>
                <button class="btn num" data-value="9">9</button>
                <button class="btn operator" data-action="divide">÷</button>
                <button class="btn func sci-func" data-action="tenPow" title="10ˣ">10ˣ</button>
                <button class="btn func sci-func" data-action="reciprocal" title="1/x">1/x</button>
            </div>
            <div class="sci-row">
                <button class="btn num" data-value="4">4</button>
                <button class="btn num" data-value="5">5</button>
                <button class="btn num" data-value="6">6</button>
                <button class="btn operator" data-action="multiply">×</button>
                <button class="btn func sci-func" data-action="xSquared" title="x²">x²</button>
                <button class="btn func sci-func" data-action="xCubed" title="x³">x³</button>
            </div>
            <div class="sci-row">
                <button class="btn num" data-value="1">1</button>
                <button class="btn num" data-value="2">2</button>
                <button class="btn num" data-value="3">3</button>
                <button class="btn operator" data-action="subtract">−</button>
                <button class="btn func sci-func" data-action="degRad" title="Degrees/Radians">DEG</button>
                <button class="btn func sci-func" data-action="random" title="Random">Rand</button>
            </div>
            <div class="sci-row">
                <button class="btn num" data-value="0" style="grid-column: span 2">0</button>
                <button class="btn num" data-value=".">.</button>
                <button class="btn operator" data-action="add">+</button>
                <button class="btn func sci-func" data-action="negate" title="Negate">±</button>
                <button class="btn equals" data-action="equals">=</button>
            </div>
        </div>
        
        <aside class="history-panel" id="historyPanel" aria-label="Calculation history">
            <div class="history-header">
                <h3>History</h3>
                <button class="icon-btn" id="clearHistory" aria-label="Clear history" title="Clear history">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
            </div>
            <div class="history-list" id="historyList"></div>
            <p class="history-empty" id="historyEmpty">No calculations yet</p>
        </aside>
    </div>
    <script src="calci.js"></script>
</body>
</html>
